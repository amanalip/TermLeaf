[advisories]
yanked = "deny"
ignore = [
    # RUSTSEC-2024-0436: paste is unmaintained but has no known vulnerability.
    # It arrives only through exr -> pulp (SIMD dispatch), which the locked
    # OpenEXR decoder feature pulls in; the chain is decode-only, offline, and
    # already bounded by the image resource limits. Revisit when exr drops
    # pulp or the advisory gains a fix.
    "RUSTSEC-2024-0436",
]

[licenses]
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "GPL-3.0-only",
    "MIT",
    # arrayref, used by resvg's bounded rasterizer, is BSD-2-Clause.
    "BSD-2-Clause",
    # encoding_rs ships its WHATWG mapping tables under BSD-3-Clause.
    "BSD-3-Clause",
    # option-ext, pulled in by directories, is file-level MPL-2.0.
    "MPL-2.0",
    # scraper (HTML5 parsing) is ISC.
    "ISC",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
skip = [
    { name = "hashbrown", version = "0.16.1", reason = "Ratatui currently resolves both versions through separate internal dependencies" },
    { name = "syn", version = "2.0.119", reason = "Crossterm and Ratatui macros have not converged on syn 3" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
