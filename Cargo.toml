[package]
name = "termleaf"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-only"
description = "A focused terminal e-reader"
repository = "https://github.com/amanap/TermLeaf"
readme = "README.md"
keywords = ["ebook", "reader", "terminal", "tui"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0"
base64 = "0.22"
cap-std = { version = "4.0.3", default-features = false }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
ctrlc = "3.5"
directories = "6.0.0"
ego-tree = "0.11"
encoding_rs = "0.8.35"
flate2 = "1.1.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico", "tiff", "pnm", "tga", "qoi", "dds", "hdr", "exr", "ff"] }
pulldown-cmark = { version = "0.13", default-features = false }
quick-xml = { version = "0.41", default-features = false }
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
rbook = { version = "0.7.10", default-features = false, features = ["prelude"] }
resvg = { version = "0.45.1", default-features = false }
scraper = "0.27.0"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
toml = "1.1.4"
unicode-linebreak = "0.1.5"
unicode-normalization = "0.1.24"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
zip = { version = "8.1", default-features = false, features = ["deflate"] }

[dev-dependencies]
portable-pty = { version = "0.9", default-features = false }
tempfile = "3.23"
unicode-segmentation = "1.13"
vt100 = "0.16"
zip = { version = "8.1", default-features = false, features = ["deflate", "time"] }

[target.'cfg(unix)'.dev-dependencies]
nix = { version = "0.28", features = ["process", "signal"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
